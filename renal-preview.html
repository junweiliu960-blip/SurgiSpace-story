<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SurgiSpace 肾病例验收</title><body><div id="app"></div><script type="module">globalThis.SURGISPACE_PLAYER_ID='isolated-improvement-preview';const {previewRenalNode}=await import('/src/main.js');const select=document.createElement('select');select.setAttribute('aria-label','验收题目');select.id='preview-node';select.style.cssText='position:fixed;top:5px;left:40%;z-index:200';for(const [v,t]of [[0,'D01 问诊'],[4,'D05 报告'],[12,'S03 显露'],[13,'S04 连接']])select.add(new Option(t,v));document.body.append(select);select.onchange=()=>previewRenalNode(Number(select.value));previewRenalNode(0);</script></body></html>
